name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-icon-file-type:
    name: icon-file-type
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icon-file-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: icon-file-type/package-lock.json
      - run: npm ci
      - run: npm run build

  build-open-images:
    name: open-images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-images/package-lock.json
      - run: npm ci
      - run: npm run build
